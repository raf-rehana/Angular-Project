<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div>
      <h2 class="fw-bold text-dark mb-0">Service Catalogue</h2>
      <p class="text-muted">Browse and request our available services</p>
    </div>
    <div class="position-relative" style="max-width: 300px; width: 100%;">
      <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
      <input type="text" class="form-control form-control-lg bg-white border-0 shadow-sm ps-5 rounded-pill" placeholder="Search services..." (input)="onSearch($event)">
    </div>
  </div>

  <!-- Categories -->
  <div class="d-flex overflow-auto pb-3 mb-4 gap-2 no-scrollbar">
    <button class="btn rounded-pill px-4" 
            [ngClass]="activeCategoryId === null ? 'btn-primary shadow-sm' : 'btn-outline-secondary bg-white text-dark'"
            (click)="filterByCategory(null)">
      All Services
    </button>
    <button *ngFor="let cat of categories" class="btn rounded-pill px-4 text-nowrap d-flex align-items-center"
            [ngClass]="activeCategoryId === cat.id ? 'btn-primary shadow-sm' : 'btn-outline-secondary bg-white text-dark'"
            (click)="filterByCategory(cat.id)">
      <i class="{{ cat.icon }} me-2"></i> {{ cat.name }}
    </button>
  </div>

  <!-- Services Grid -->
  <div class="row g-4">
    <div class="col-md-6 col-lg-4 col-xl-3" *ngFor="let service of filteredServices">
      <div class="card h-100 border-0 shadow-sm rounded-4 service-card overflow-hidden">
        <div class="card-body p-4 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <span class="badge bg-light text-primary border border-primary px-3 py-2 rounded-pill">{{ service.categoryName }}</span>
            <div class="fs-4 fw-bold text-dark">${{ service.price }} <span class="fs-6 text-muted fw-normal" *ngIf="service.priceType === 'MONTHLY'">/mo</span></div>
          </div>
          
          <h5 class="fw-bold text-dark mb-2">{{ service.name }}</h5>
          <p class="text-muted flex-grow-1 small">{{ service.description }}</p>
          
          <div class="d-flex align-items-center mb-4 text-muted small">
            <i class="bi bi-clock me-2 text-primary"></i> {{ service.deliveryDays }} delivery
          </div>
          
          <button class="btn btn-outline-primary w-100 rounded-pill py-2 fw-bold" 
                  [routerLink]="['/client/request-form']" 
                  [queryParams]="{ serviceId: service.id }">
            Request Service
          </button>
        </div>
      </div>
    </div>
    
    <div class="col-12 text-center py-5" *ngIf="filteredServices.length === 0">
      <i class="bi bi-search display-1 text-muted mb-3 d-block opacity-25"></i>
      <h4 class="text-muted">No services found</h4>
      <p class="text-muted mb-0">Try adjusting your filters or search query.</p>
    </div>
  </div>
</div>
