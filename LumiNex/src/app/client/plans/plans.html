<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-xl-7">
      
      <div class="text-center mb-5">
        <div class="badge bg-primary-soft text-primary px-3 py-2 rounded-pill mb-3 fw-bold tracking-wide">PLAN YOUR PROJECT</div>
        <h2 class="fw-bold text-dark display-6 mb-2">Tell Us About Your Vision</h2>
        <p class="text-muted">Fill out this brief questionnaire so our experts can prepare the perfect solution for you.</p>
      </div>

      <div class="card border-0 shadow-lg rounded-5 overflow-hidden">
        <div class="card-header bg-white border-bottom p-4 p-md-5">
          <h5 class="fw-bold mb-0">Project Questionnaire</h5>
        </div>
        <div class="card-body p-4 p-md-5">
          <form (ngSubmit)="submitConfig()" #form="ngForm">
            
            <!-- Q1: Project Name -->
            <div class="mb-4 pb-3 border-bottom">
              <label class="form-label fw-bold text-dark mb-2">1. What is the name of your project/startup?</label>
              <input type="text" class="form-control bg-light border-0 py-3 rounded-4" [(ngModel)]="config.projectName" name="projectName" placeholder="e.g. LumiNex SaaS" required>
            </div>

            <!-- Q2: Project Type -->
            <div class="mb-4 pb-3 border-bottom">
              <label class="form-label fw-bold text-dark mb-3">2. What type of project are you planning?</label>
              <div class="row g-3">
                <div class="col-md-6" *ngFor="let type of ['Web Application', 'Mobile App (iOS/Android)', 'E-Commerce Platform', 'Corporate Website', 'Custom Software']">
                  <div class="form-check custom-radio border rounded-4 p-3 cursor-pointer" [class.border-primary]="config.projectType === type" [class.bg-primary-soft]="config.projectType === type" (click)="config.projectType = type">
                    <input class="form-check-input ms-1" type="radio" name="projectType" [value]="type" [(ngModel)]="config.projectType">
                    <label class="form-check-label fw-medium ms-2 cursor-pointer">{{ type }}</label>
                  </div>
                </div>
              </div>
            </div>

            <!-- Q3: Timeline -->
            <div class="mb-4 pb-3 border-bottom">
              <label class="form-label fw-bold text-dark mb-2">3. What is your expected timeline?</label>
              <select class="form-select bg-light border-0 py-3 rounded-4" [(ngModel)]="config.timeline" name="timeline">
                <option value="ASAP">As soon as possible (Urgent)</option>
                <option value="1-3 Months">1 to 3 Months</option>
                <option value="3-6 Months">3 to 6 Months</option>
                <option value="Flexible">Flexible / No strict deadline</option>
              </select>
            </div>

            <!-- Q4: Budget -->
            <div class="mb-4 pb-3 border-bottom">
              <label class="form-label fw-bold text-dark mb-2">4. What is your estimated budget range?</label>
              <select class="form-select bg-light border-0 py-3 rounded-4" [(ngModel)]="config.budget" name="budget">
                <option value="BDT 10,000 - BDT 50,000">BDT 10,000 - BDT 50,000</option>
                <option value="BDT 50,000 - BDT 100,000">BDT 50,000 - BDT 100,000</option>
                <option value="BDT 100,000 - BDT 500,000">BDT 100,000 - BDT 500,000</option>
                <option value="BDT 500,000+">BDT 500,000+</option>
              </select>
            </div>

            <!-- Q5: Target Audience -->
            <div class="mb-4 pb-3 border-bottom">
              <label class="form-label fw-bold text-dark mb-2">5. Who is your target audience or primary customer?</label>
              <input type="text" class="form-control bg-light border-0 py-3 rounded-4" [(ngModel)]="config.targetAudience" name="targetAudience" placeholder="e.g. Small business owners, students, enterprise clients...">
            </div>

            <!-- Q6: Branding -->
            <div class="mb-4 pb-3 border-bottom">
              <label class="form-label fw-bold text-dark mb-3">6. Do you have existing branding (Logo, Color Palette)?</label>
              <div class="d-flex gap-3">
                <div class="form-check custom-radio border rounded-4 p-3 flex-fill cursor-pointer" [class.border-primary]="config.existingBranding === 'Yes'" [class.bg-primary-soft]="config.existingBranding === 'Yes'" (click)="config.existingBranding = 'Yes'">
                  <input class="form-check-input ms-1" type="radio" name="existingBranding" value="Yes" [(ngModel)]="config.existingBranding">
                  <label class="form-check-label fw-medium ms-2 cursor-pointer">Yes, we have it</label>
                </div>
                <div class="form-check custom-radio border rounded-4 p-3 flex-fill cursor-pointer" [class.border-primary]="config.existingBranding === 'No'" [class.bg-primary-soft]="config.existingBranding === 'No'" (click)="config.existingBranding = 'No'">
                  <input class="form-check-input ms-1" type="radio" name="existingBranding" value="No" [(ngModel)]="config.existingBranding">
                  <label class="form-check-label fw-medium ms-2 cursor-pointer">No, we need branding</label>
                </div>
              </div>
            </div>

            <!-- Q7: Description -->
            <div class="mb-5">
              <label class="form-label fw-bold text-dark mb-2">7. Please describe your project in detail.</label>
              <textarea class="form-control bg-light border-0 py-3 rounded-4" rows="5" [(ngModel)]="config.description" name="description" placeholder="Share your main goals, required features, competitor references, or any specific ideas you have in mind..." required></textarea>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary btn-lg rounded-pill py-3 fw-bold text-white shadow-sm transition-all" [disabled]="!form.valid || loading">
                <span *ngIf="!loading"><i class="bi bi-paperclip me-2"></i> Submit Project Proposal</span>
                <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
