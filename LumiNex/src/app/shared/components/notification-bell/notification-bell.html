<div class="dropdown">
  <button class="btn btn-link nav-link position-relative dropdown-toggle" type="button" id="notificationDropdown" data-bs-toggle="dropdown" aria-expanded="false">
    <i class="bi bi-bell fs-5" [ngClass]="iconClass"></i>
    <span *ngIf="unreadCount > 0" class="position-absolute top-25 start-75 translate-middle badge rounded-pill bg-danger">
      {{ unreadCount }}
    </span>
  </button>
  <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="notificationDropdown">
    <li><h6 class="dropdown-header">Notifications</h6></li>
    <li *ngIf="unreadCount === 0"><span class="dropdown-item text-muted">No new notifications</span></li>
    <li><hr class="dropdown-divider"></li>
    <li><a class="dropdown-item text-center small text-primary" [routerLink]="viewAllLink">View All</a></li>
  </ul>
</div>
