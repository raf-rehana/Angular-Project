<nav class="fixed top-0 left-0 right-0 z-[1050] w-full transition-all duration-300 bg-slate-900 border-b border-slate-800 shadow-sm">
  <div class="container mx-auto px-4 md:px-6">
    <div class="flex h-16 md:h-20 items-center justify-between">
      
      <!-- Logo & Left Content -->
      <div class="flex items-center gap-10">
        <a class="flex items-center gap-3 no-underline group" routerLink="/" *ngIf="themeService.themeSettings$ | async as theme">
          <div class="relative w-10 h-10 overflow-hidden rounded-xl bg-primary-500 flex items-center justify-center shadow-lg transition-all group-hover:scale-110 group-hover:rotate-3">
            <i class="bi bi-lightning-charge-fill text-white text-xl"></i>
            <div class="absolute inset-0 bg-gradient-to-tr from-primary-600/20 to-transparent"></div>
          </div>
          <div class="flex flex-col -space-y-1">
            <span class="text-xl font-black text-white tracking-tight">{{theme.siteName}}</span>
            <span class="text-[10px] font-bold text-violet-300 uppercase tracking-widest">Premium Startup Hub</span>
          </div>
        </a>

        <!-- Desktop Menu -->
        <div class="hidden lg:flex items-center gap-8">
          <a class="relative text-sm font-bold text-slate-300 hover:text-white transition-colors py-2 group no-underline" routerLink="/" routerLinkActive="text-primary-600" [routerLinkActiveOptions]="{exact: true}">
            Home
          </a>
          <a class="relative text-sm font-bold text-slate-300 hover:text-white transition-colors py-2 group no-underline" routerLink="/services" routerLinkActive="text-primary-600">
            Services
          </a>
          <a class="relative text-sm font-bold text-slate-300 hover:text-white transition-colors py-2 group no-underline" routerLink="/packages" routerLinkActive="text-primary-600">
            Packages
          </a>
          <a class="relative text-sm font-bold text-slate-300 hover:text-white transition-colors py-2 group no-underline" routerLink="/about" routerLinkActive="text-primary-600">
            About Us
          </a>
          <a class="relative text-sm font-bold text-slate-300 hover:text-white transition-colors py-2 group no-underline" routerLink="/contact" routerLinkActive="text-primary-600">
            Contact
          </a>
        </div>
      </div>

      <!-- Right Content -->
      <div class="flex items-center gap-4">
        <div class="hidden md:flex items-center" *ngIf="authService.isLoggedIn()">
          <app-notification-bell iconClass="text-white"></app-notification-bell>
        </div>

        <div class="relative" *ngIf="authService.currentUser$ | async as user; else loginLink">
          <button class="flex items-center gap-2.5 p-1 rounded-full hover:bg-slate-800 transition-all border border-transparent hover:border-slate-700" id="userDropdown" data-bs-toggle="dropdown">
            <div class="w-8 h-8 rounded-full bg-primary-600 text-white font-bold flex items-center justify-center overflow-hidden shadow-sm">
              <img *ngIf="user.avatar; else initialAvatar" [src]="user.avatar" class="w-full h-full object-cover">
              <ng-template #initialAvatar>
                {{ user.name.charAt(0) | uppercase }}
              </ng-template>
            </div>
            <span class="hidden md:inline text-sm font-bold text-white pr-1">{{ user.name }}</span>
            <i class="bi bi-chevron-down text-[10px] text-slate-400"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-premium border-0 mt-3 rounded-2xl p-2 min-w-[220px] animate-fade-in">
            <ng-container *ngIf="user.role === 'CLIENT'">
              <li><a class="dropdown-item rounded-xl py-2.5 flex items-center gap-3 font-semibold text-slate-600 hover:bg-slate-50" routerLink="/client/dashboard"><i class="bi bi-speedometer2 text-lg"></i> Dashboard</a></li>
            </ng-container>
            <ng-container *ngIf="user.role === 'EMPLOYEE'">
              <li><a class="dropdown-item rounded-xl py-2.5 flex items-center gap-3 font-semibold text-slate-600 hover:bg-slate-50" routerLink="/employee/summary"><i class="bi bi-speedometer2 text-lg"></i> Dashboard</a></li>
            </ng-container>
            <ng-container *ngIf="user.role === 'ADMIN' || user.role === 'SUPER_ADMIN'">
              <li><a class="dropdown-item rounded-xl py-2.5 flex items-center gap-3 font-semibold text-slate-600 hover:bg-slate-50" routerLink="/admin/dashboard"><i class="bi bi-speedometer2 text-lg"></i> Dashboard</a></li>
            </ng-container>
            <li><a class="dropdown-item rounded-xl py-2.5 flex items-center gap-3 font-semibold text-slate-600 hover:bg-slate-50" routerLink="/client/profile"><i class="bi bi-person text-lg"></i> Profile Settings</a></li>
            <li><hr class="dropdown-divider my-2 opacity-30"></li>
            <li><button class="dropdown-item rounded-xl py-2.5 flex items-center gap-3 font-semibold text-red-600 hover:bg-red-50" (click)="logout()"><i class="bi bi-box-arrow-right text-lg"></i> Sign Out</button></li>
          </ul>
        </div>

        <ng-template #loginLink>
          <div class="flex items-center gap-2">
            <a class="hidden sm:inline-flex px-5 py-2.5 text-sm font-bold text-slate-300 hover:text-white transition-colors no-underline" routerLink="/login">Sign In</a>
            <a class="inline-flex px-6 py-2.5 bg-primary-600 text-white text-sm font-bold rounded-full shadow-sm hover:bg-primary-500 hover:shadow-lg transition-all active:scale-95" routerLink="/register">Get Started</a>
          </div>
        </ng-template>

        <!-- Mobile Menu Toggle -->
        <button class="lg:hidden p-2 text-white hover:bg-slate-800 rounded-xl" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
          <i class="bi bi-list text-2xl"></i>
        </button>
      </div>

    </div>
  </div>
</nav>
