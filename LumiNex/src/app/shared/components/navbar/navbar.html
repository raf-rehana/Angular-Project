<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
  <div class="container-fluid px-4">
    <button class="btn btn-link text-dark d-lg-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" *ngIf="authService.isLoggedIn()">
      <i class="bi bi-list fs-4"></i>
    </button>
    
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <div class="logo-icon bg-primary text-white rounded-3 me-2 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
        <i class="bi bi-lightning-fill"></i>
      </div>
      <span class="fw-bold text-dark fs-4">LumiNex</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/']" fragment="services">Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/packages" routerLinkActive="active">Packages</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/']" fragment="about">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact</a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item me-3" *ngIf="authService.isLoggedIn()">
          <app-notification-bell></app-notification-bell>
        </li>
        
        <li class="nav-item dropdown" *ngIf="authService.currentUser$ | async as user; else loginLink">
          <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
            <div class="avatar-circle bg-primary text-white me-2 fw-bold d-flex align-items-center justify-content-center overflow-hidden" style="width: 32px; height: 32px; border-radius: 50%;">
              <img *ngIf="user.avatar; else initialAvatar" [src]="user.avatar" class="img-fluid w-100 h-100 object-fit-cover">
              <ng-template #initialAvatar>
                {{ user.name?.charAt(0) | uppercase }}
              </ng-template>
            </div>
            <span class="d-none d-md-inline">{{ user.name }}</span>

          </ul>
        </li>
        <ng-template #loginLink>
          <li class="nav-item"><a class="btn btn-outline-primary me-2" routerLink="/auth/login">Login</a></li>
          <li class="nav-item"><a class="btn btn-primary" routerLink="/auth/register">Sign Up</a></li>
        </ng-template>
      </ul>
    </div>
  </div>
