<div class="relative min-h-screen flex items-center justify-center bg-gray-50 overflow-hidden px-4">
  
  <!-- Dynamic Background Shapes -->
  <div class="absolute top-0 left-0 w-96 h-96 bg-primary-100 rounded-full blur-[100px] -translate-x-1/2 -translate-y-1/2 opacity-60"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 bg-blue-100 rounded-full blur-[100px] translate-x-1/2 translate-y-1/2 opacity-60"></div>
  <div class="absolute top-1/2 left-1/2 w-64 h-64 bg-indigo-50 rounded-full blur-[120px] -translate-x-1/2 -translate-y-1/2 opacity-40"></div>

  <div class="relative z-10 w-full max-w-lg">
    <div class="bg-white/80 backdrop-blur-xl border border-white rounded-[2rem] shadow-2xl overflow-hidden">
      <div class="p-8 md:p-12">
        
        <div class="text-center mb-10">
          <a routerLink="/" class="inline-flex items-center gap-3 mb-6 group">
            <div class="w-12 h-12 bg-primary-600 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg transition-transform group-hover:scale-110">
              <i class="bi bi-lightning-fill"></i>
            </div>
          </a>
          <h2 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h2>
          <p class="text-gray-500 font-medium">Enter your credentials to access your portal</p>
        </div>



        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
          <div class="space-y-2">
            <label class="text-sm font-bold text-gray-700 ml-1">Email Address</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                <i class="bi bi-envelope"></i>
              </div>
              <input type="email" formControlName="email" class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:bg-white transition-all font-medium" placeholder="name@company.com">
            </div>
            <div *ngIf="email?.invalid && email?.touched" class="text-red-500 text-xs font-bold ml-1">Valid email is required</div>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-center ml-1">
              <label class="text-sm font-bold text-gray-700">Password</label>
              <a routerLink="/forgot" class="text-sm font-bold text-primary-600 hover:underline">Forgot?</a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                <i class="bi bi-shield-lock"></i>
              </div>
              <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="w-full pl-11 pr-12 py-3.5 bg-gray-50 border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:bg-white transition-all font-medium" placeholder="••••••••">
              <button type="button" (click)="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-primary-600">
                <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center gap-3 ml-1">
            <input type="checkbox" id="rememberMe" class="w-5 h-5 rounded border-gray-200 text-primary-600 focus:ring-primary-500 transition-all cursor-pointer">
            <label for="rememberMe" class="text-sm font-medium text-gray-500 cursor-pointer">Remember me for 30 days</label>
          </div>

          <div *ngIf="error" class="p-4 bg-red-50 border border-red-100 rounded-2xl flex items-center gap-3 text-red-600 text-sm font-bold animate-shake">
            <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
          </div>

          <button type="submit" [disabled]="loading" class="w-full py-4 bg-primary-600 text-white rounded-full font-bold text-lg shadow-lg hover:bg-primary-700 hover:shadow-xl transition-all active:scale-[0.98] disabled:opacity-50 flex items-center justify-center gap-3">
            <span *ngIf="!loading">Sign In</span>
            <div *ngIf="loading" class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          </button>
        </form>

        <div class="text-center mt-10">
          <p class="text-gray-500 font-medium">
            New to LumiNex? 
            <a routerLink="/register" class="text-primary-600 font-bold hover:underline ml-1">Create Account</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
