<div class="auth-container d-flex align-items-center justify-content-center min-vh-100 position-relative overflow-hidden">
  <!-- Dynamic Background -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <div class="container position-relative z-index-1">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        <div class="card glass-card border-0 rounded-4 overflow-hidden">
          <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-5">
              <a routerLink="/" class="text-decoration-none d-inline-block mb-3">
                <div class="logo-box mx-auto d-flex align-items-center justify-content-center rounded-3 bg-gradient-primary">
                  <i class="bi bi-brightness-high-fill text-white fs-3"></i>
                </div>
              </a>
              <h3 class="fw-bold text-dark tracking-tight">Welcome to LumiNex</h3>
              <p class="text-secondary small">Enter your credentials to access your portal</p>
            </div>

            <!-- Demo Access -->
            <div class="demo-access mb-4 text-center">
              <div class="d-flex justify-content-center gap-2">
                <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-medium" (click)="demoLogin('client')">Client</button>
                <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-medium" (click)="demoLogin('admin')">Admin</button>
                <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-medium" (click)="demoLogin('employee')">Employee</button>
              </div>
            </div>

            <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate autocomplete="off">
              <!-- Dummy input to trick browsers from autofilling -->
              <input type="email" style="display:none" autocomplete="false">
              <input type="password" style="display:none" autocomplete="false">

              <div class="form-floating mb-3 custom-floating">
                <input type="email" class="form-control" id="emailInput" formControlName="email" placeholder="name@example.com" autocomplete="new-password">
                <label for="emailInput">Email Address</label>
                <div class="text-danger small mt-1 ps-2" *ngIf="email?.invalid && email?.touched">
                  Valid email required.
                </div>
              </div>

              <div class="form-floating mb-4 custom-floating position-relative">
                <input [type]="showPassword ? 'text' : 'password'" class="form-control pe-5" id="passwordInput" formControlName="password" placeholder="Password" autocomplete="new-password">
                <label for="passwordInput">Password</label>
                <button type="button" class="btn btn-link text-muted position-absolute end-0 top-50 translate-middle-y text-decoration-none shadow-none" (click)="showPassword = !showPassword">
                  <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                </button>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input custom-checkbox" type="checkbox" id="rememberMe">
                  <label class="form-check-label small text-secondary" for="rememberMe">Remember me</label>
                </div>
                <a routerLink="/auth/forgot" class="small text-primary fw-bold text-decoration-none hover-underline">Forgot Password?</a>
              </div>

              <div class="alert alert-danger border-0 small mb-4 rounded-3 d-flex align-items-center" *ngIf="error">
                <i class="bi bi-exclamation-octagon-fill me-2 fs-5"></i> {{ error }}
              </div>

              <div class="d-grid mb-4">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill py-3 fw-bold text-white btn-glow transition-all" [disabled]="loading">
                  <span *ngIf="!loading">Sign In</span>
                  <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
        
        <div class="text-center mt-4">
          <p class="text-secondary small fw-medium">
            Don't have an account? 
            <a routerLink="/auth/register" class="text-primary fw-bold text-decoration-none hover-underline ms-1">Create Account</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
