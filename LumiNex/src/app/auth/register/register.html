<div class="auth-container bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card border border-light shadow-sm rounded-md overflow-hidden">
          <div class="row g-0">
            <!-- Register Form Panel -->
            <div class="col-12 bg-white p-4 p-md-5">
              <div class="mb-4 d-flex justify-content-between align-items-center">
                <a routerLink="/" class="text-decoration-none text-secondary small d-flex align-items-center fw-medium">
                  <i class="bi bi-arrow-left me-2"></i> Back to Website
                </a>
              </div>
              <div class="mb-4 d-flex justify-content-between align-items-start">
                <div>
                  <h3 class="fw-bold text-dark mb-1">Create Account</h3>
                  <p class="text-secondary small">Join LumiNex and start your project today.</p>
                </div>
                <div class="badge bg-light text-primary px-3 py-2 rounded-pill small">Step {{ currentStep }}/3</div>
              </div>

              <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
                
                <!-- Step 1: Company Details -->
                <div *ngIf="currentStep === 1" class="animate-fade-in">
                  <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">Company Name</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light border-0"><i class="bi bi-building text-muted"></i></span>
                      <input type="text" class="form-control bg-light border-0 py-2" formControlName="companyName">
                    </div>
                  </div>

                  <div class="mb-4">
                    <label class="form-label fw-bold small text-muted">Business Type</label>
                    <select class="form-select bg-light border-0 py-2" formControlName="businessType">
                      <option value="">Select industry...</option>
                      <option value="IT">IT & Software</option>
                      <option value="ECOMMERCE">E-Commerce</option>
                      <option value="HEALTHCARE">Healthcare</option>
                      <option value="FINANCE">Finance</option>
                      <option value="OTHER">Other</option>
                    </select>
                  </div>

                  <div class="d-grid pt-3">
                    <button type="button" class="btn btn-primary rounded-md py-2 fw-bold text-white shadow-sm" (click)="nextStep()">
                      Next Step <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                  </div>
                </div>

                <!-- Step 2: Location Details -->
                <div *ngIf="currentStep === 2" class="animate-fade-in">
                  <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">Country</label>
                    <select class="form-select bg-light border-0 py-2" formControlName="country" (change)="onCountryChange()">
                      <option *ngFor="let c of countries" [value]="c.name">{{ c.name }}</option>
                    </select>
                  </div>

                  <ng-container *ngIf="divisions.length > 0">
                    <div class="row g-3 mb-3">
                      <div class="col-md-6">
                        <label class="form-label fw-bold small text-muted">Division / State</label>
                        <select class="form-select bg-light border-0 py-2" formControlName="division" (change)="onDivisionChange()">
                          <option value="">Select Division / State</option>
                          <option *ngFor="let div of divisions" [value]="div.name">{{ div.name }}</option>
                        </select>
                      </div>
                      <div class="col-md-6" *ngIf="districts.length > 0">
                        <label class="form-label fw-bold small text-muted">District / City</label>
                        <select class="form-select bg-light border-0 py-2" formControlName="district" (change)="onDistrictChange()">
                          <option value="">Select District / City</option>
                          <option *ngFor="let dis of districts" [value]="dis.name">{{ dis.name }}</option>
                        </select>
                      </div>
                    </div>
                  </ng-container>

                  <div class="mb-3" *ngIf="thanas.length > 0">
                    <label class="form-label fw-bold small text-muted">Police Station / Area</label>
                    <select class="form-select bg-light border-0 py-2" formControlName="thana">
                      <option value="">Select Police Station / Area</option>
                      <option *ngFor="let t of thanas" [value]="t.name">{{ t.name }}</option>
                    </select>
                  </div>

                  <div class="mb-4">
                    <label class="form-label fw-bold small text-muted">Village / Street Address</label>
                    <input type="text" class="form-control bg-light border-0 py-2" formControlName="village">
                  </div>

                  <div class="d-flex gap-3">
                    <button type="button" class="btn btn-light rounded-md px-3 py-2 fw-bold" (click)="prevStep()">Back</button>
                    <button type="button" class="btn btn-primary flex-grow-1 rounded-md py-2 fw-bold text-white shadow-sm" (click)="nextStep()">
                      Next Step <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                  </div>
                </div>

                <!-- Step 3: User Details -->
                <div *ngIf="currentStep === 3 && !success" class="animate-fade-in">
                  <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">Full Name</label>
                    <input type="text" class="form-control bg-light border-0 py-2" formControlName="name">
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">Email Address</label>
                    <input type="email" class="form-control bg-light border-0 py-2" formControlName="email">
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">Phone Number</label>
                    <div class="input-group">
                      <select class="form-select bg-light border-0 py-2" style="max-width: 120px;" formControlName="countryCode">
                        <option *ngFor="let c of countries" [value]="c.code">{{ c.flag }} {{ c.code }}</option>
                      </select>
                      <input type="text" class="form-control bg-light border-0 py-2" formControlName="phone">
                    </div>
                  </div>

                  <div class="mb-4">
                    <label class="form-label fw-bold small text-muted">Password</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light border-0"><i class="bi bi-lock text-muted"></i></span>
                      <input [type]="showPassword ? 'text' : 'password'" class="form-control bg-light border-0 py-2" formControlName="password">
                      <button type="button" class="btn bg-light border-0" (click)="showPassword = !showPassword">
                        <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                      </button>
                    </div>
                  </div>

                  <div class="alert alert-danger border-0 small mb-4" *ngIf="error">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
                  </div>

                  <div class="d-flex gap-3">
                    <button type="button" class="btn btn-light rounded-md px-3 py-2 fw-bold" (click)="prevStep()">Back</button>
                    <button type="submit" class="btn btn-primary flex-grow-1 rounded-md py-2 fw-bold text-white shadow-sm" [disabled]="loading || form.invalid">
                      <span *ngIf="!loading">Complete Registration</span>
                      <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                    </button>
                  </div>
                </div>

                <!-- Success Message -->
                <div *ngIf="success" class="text-center py-5 animate-fade-in">
                  <div class="bg-success-soft text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-4 shadow-sm" style="width: 80px; height: 80px;">
                    <i class="bi bi-check-lg fs-1"></i>
                  </div>
                  <h4 class="fw-bold">Registration Successful!</h4>
                  <p class="text-secondary">Welcome to LumiNex. Redirecting you to login...</p>
                </div>
              </form>

              <div class="mt-5 pt-4 border-top text-center" *ngIf="!success">
                <span class="text-secondary small">Already have an account?</span>
                <a routerLink="/login" class="text-primary text-decoration-none fw-bold small ms-2">Sign In</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
