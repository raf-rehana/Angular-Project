<div class="contact-wrapper bg-white">

  <main class="py-5">
    <div class="container py-5">
      <div class="row g-5 align-items-center">
        <!-- Contact Info -->
        <div class="col-lg-5">
        <div class="col-lg-5">
          <h1 class="fw-bold text-dark mb-3">Contact Us</h1>
          <p class="text-secondary mb-5">Have a question or need a custom solution? Reach out to our team.</p>
          
          <div class="contact-cards">
            <div class="mb-4 d-flex align-items-center">
              <i class="bi bi-envelope-fill text-secondary fs-4 me-3"></i>
              <div>
                <h6 class="fw-bold mb-0">Email</h6>
                <p class="text-secondary small mb-0">hello@luminex.com</p>
              </div>
            </div>
            
            <div class="mb-4 d-flex align-items-center">
              <i class="bi bi-telephone-fill text-secondary fs-4 me-3"></i>
              <div>
                <h6 class="fw-bold mb-0">Phone</h6>
                <p class="text-secondary small mb-0">+880 1605 142112</p>
              </div>
            </div>
            
            <div class="mb-4 d-flex align-items-center">
              <i class="bi bi-geo-alt-fill text-secondary fs-4 me-3"></i>
              <div>
                <h6 class="fw-bold mb-0">Office</h6>
                <p class="text-secondary small mb-0">Tech Plaza, Sector 7, Uttara, Dhaka</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Contact Form -->
        <div class="col-lg-7">
          <div class="card border border-light shadow-sm rounded-md p-4">
            <h3 class="fw-bold text-dark mb-4">Send us a message</h3>
            
            <form #contactForm="ngForm" (ngSubmit)="submitForm()">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="fullName" class="form-label text-muted small fw-bold">Full Name</label>
                  <input type="text" class="form-control border-0 bg-light rounded-md py-2" id="fullName" required name="name" [(ngModel)]="formData.name">
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label text-muted small fw-bold">Email Address</label>
                  <input type="email" class="form-control border-0 bg-light rounded-md py-2" id="email" required name="email" [(ngModel)]="formData.email">
                </div>
                <div class="col-12">
                  <label for="service" class="form-label text-muted small fw-bold">Service Interested In</label>
                  <select class="form-select border-0 bg-light rounded-md py-2" id="service" name="service" [(ngModel)]="formData.service">
                    <option value="Web Development">Web Development</option>
                    <option value="Graphic Design">Graphic Design</option>
                    <option value="Digital Marketing">Digital Marketing</option>
                    <option value="Consultancy">Business Consultancy</option>
                  </select>
                </div>
                <div class="col-12">
                  <label for="message" class="form-label text-muted small fw-bold">Message</label>
                  <textarea class="form-control border-0 bg-light rounded-md py-2" id="message" style="height: 120px" required name="message" [(ngModel)]="formData.message"></textarea>
                </div>
                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-primary rounded-md px-4 py-2 fw-bold shadow-sm" [disabled]="!contactForm.form.valid">
                    Send Message
                  </button>
                </div>
              </div>
            </form>
            
            <div class="alert alert-success border-0 rounded-md mt-4 py-3 d-flex align-items-center" *ngIf="isSubmitted">
              <i class="bi bi-check-circle-fill me-3"></i>
              <div>
                <div class="fw-bold">Message sent</div>
                <div class="small">Thank you, {{ formData.name }}. We will get back to you shortly.</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
