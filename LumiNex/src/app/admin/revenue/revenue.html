<div class="container-fluid py-4">
  <div class="row g-4 mb-5">
    <div class="col-md-3">
      <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
        <div class="small fw-bold text-muted text-uppercase mb-1">Total Revenue</div>
        <div class="h3 fw-bold text-dark">$124,500</div>
        <div class="small text-success fw-bold mt-2"><i class="bi bi-arrow-up"></i> 12.5%</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
        <div class="small fw-bold text-muted text-uppercase mb-1">Subscriptions</div>
        <div class="h3 fw-bold text-dark">$45,200</div>
        <div class="small text-success fw-bold mt-2"><i class="bi bi-arrow-up"></i> 8.2%</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
        <div class="small fw-bold text-muted text-uppercase mb-1">Services</div>
        <div class="h3 fw-bold text-dark">$79,300</div>
        <div class="small text-danger fw-bold mt-2"><i class="bi bi-arrow-down"></i> 2.1%</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card border-0 shadow-sm rounded-4 p-4 text-center bg-primary text-white">
        <div class="small fw-bold opacity-75 text-uppercase mb-1">Projected</div>
        <div class="h3 fw-bold">$150,000</div>
        <div class="small opacity-75 mt-2">End of Quarter</div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- Chart Column -->
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
        <div class="d-flex justify-content-between align-items-center mb-5">
          <h5 class="fw-bold mb-0">Revenue Growth</h5>
          <select class="form-select border-0 bg-light rounded-pill w-auto px-4 py-2 small fw-bold">
            <option>Last 6 Months</option>
            <option>Year 2026</option>
          </select>
        </div>
        
        <div class="revenue-chart d-flex align-items-end justify-content-between px-3" style="height: 250px;">
          <div *ngFor="let m of months" class="chart-bar-wrapper text-center">
            <div class="chart-bar bg-primary rounded-pill mb-2 mx-auto" [style.height.%]="m.val" style="width: 25px; transition: height 1s ease;"></div>
            <div class="small text-muted fw-bold">{{ m.name }}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Latest Transactions -->
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm rounded-4 h-100">
        <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
          <h5 class="fw-bold mb-0">Latest Income</h5>
        </div>
        <div class="card-body p-4">
          <div *ngFor="let t of transactions" class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
            <div class="d-flex align-items-center">
              <div class="bg-light rounded-circle p-2 me-3"><i class="bi bi-person-circle fs-5 text-primary"></i></div>
              <div>
                <div class="fw-bold small text-dark">{{ t.client }}</div>
                <div class="text-muted" style="font-size: 11px;">{{ t.date | date }}</div>
              </div>
            </div>
            <div class="text-end">
              <div class="fw-bold text-dark small">${{ t.amount }}</div>
              <span class="badge bg-success-soft text-success p-1 rounded" style="font-size: 9px;">PAID</span>
            </div>
          </div>
          <button class="btn btn-outline-primary w-100 rounded-pill py-2 fw-bold small">View Full Report</button>
        </div>
      </div>
    </div>
  </div>
</div>
